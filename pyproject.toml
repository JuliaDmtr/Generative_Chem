[project]
name = "parp-dif-mod"
version = "0.1.0"
description = "Conditional 3D generation of PARP-inhibitor-like molecules with an E(3)-equivariant diffusion model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "rdkit>=2026.3.4",
    "networkx>=3.0",
    "matplotlib>=3.8.0",
    "torch==2.8.0",
]

[project.optional-dependencies]
# Only needed to rebuild the datasets from scratch (scripts/download_parps.py,
# scripts/chembl_processor.py); not required to train, sample or evaluate.
data = [
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
]
